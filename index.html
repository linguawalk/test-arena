<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>test-arena · 올림피아드와 경시대회 준비</title>
<meta name="description" content="수학·과학·정보 올림피아드와 인문·사회 경시대회를 준비하는 무료 학습 사이트. 증명을 쓰고 모범 답안과 채점 기준으로 스스로 채점합니다.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--paper:#FAFBFD;--ink:#172033;--ink-soft:#4A5670;--grid:#DCE4F0;--grid-strong:#B9C7DD;--blue:#7A1F3D;--blue-soft:#F6E8EE;--marker:#FFD84D;
  --font:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif}
*{box-sizing:border-box}
html,body{margin:0;word-break:keep-all;overflow-wrap:anywhere;background:var(--paper);color:var(--ink);font-family:var(--font)}
body{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:focus-visible{outline:3px solid var(--blue);outline-offset:3px}
.wrap{max-width:1040px;margin:0 auto;padding:0 20px}
header .wrap{display:flex;align-items:center;justify-content:space-between;height:64px}
.logo{font-weight:700;font-size:18px;text-decoration:none;color:inherit}
.logo span{background:linear-gradient(transparent 58%,var(--marker) 58%)}
header nav a{font-size:16px;color:var(--ink-soft);text-decoration:none;padding:8px 10px;border-radius:8px}
header nav a:hover{background:var(--blue-soft);color:var(--blue)}
.hero{display:grid;grid-template-columns:1.05fr .95fr;gap:48px;align-items:center;padding:56px 0 64px}
h1{font-size:clamp(38px,5.6vw,64px);line-height:1.14;letter-spacing:-.035em;margin:0 0 22px;font-weight:700}
.lede{font-size:20px;line-height:1.7;color:var(--ink-soft);margin:0 0 32px;max-width:28em}
.cta{display:flex;flex-wrap:wrap;gap:12px}
.btn{display:inline-block;text-decoration:none;border-radius:10px;padding:15px 24px;font-size:17px;font-weight:700;background:var(--blue);color:#fff}
.btn.ghost{background:transparent;color:var(--blue);box-shadow:inset 0 0 0 2px var(--blue)}
.sheet{background:#fff;border:1px solid var(--grid);border-radius:14px;padding:22px 22px 18px;font-size:16px;line-height:1.65}
.sheet .q{font-weight:700;margin:0 0 12px}
.sheet ol{margin:0 0 16px;padding-left:1.3em;color:var(--ink-soft)}
.sheet ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.sheet li.c{display:grid;grid-template-columns:20px 1fr auto;gap:10px;align-items:start;border:2px solid var(--grid-strong);border-radius:6px;padding:8px 10px;font-size:15px}
.sheet li.c i{width:18px;height:18px;border:2px solid var(--blue);border-radius:4px;margin-top:3px}
.sheet li.c.on i{background:var(--blue);position:relative}
.sheet li.c.on i::after{content:"";position:absolute;left:4px;top:0;width:5px;height:10px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg)}
.sheet li.c b{font-weight:500;color:var(--ink-soft);white-space:nowrap}
.sheet figcaption{font-size:14px;color:var(--ink-soft);margin-top:12px}
.subjects{border-top:2px solid var(--ink);padding:28px 0 32px;display:grid;grid-template-columns:repeat(4,1fr);gap:24px}
.subjects a,.subjects div{display:block;text-decoration:none;color:inherit;padding:16px;border-radius:12px;border:1px solid var(--grid)}
.subjects a{background:#fff;border:2px solid var(--blue)}
.subjects a:hover{background:var(--blue-soft)}
.subjects h2{font-size:19px;margin:0 0 4px}
.subjects .path{font-size:13px;color:var(--blue);font-weight:700;margin:0 0 8px}
.subjects p{margin:0;font-size:15px;line-height:1.6;color:var(--ink-soft)}
.subjects div h2,.subjects div .path{color:var(--ink-soft)}
.subjects em{display:inline-block;margin-top:10px;font-style:normal;font-size:13px;color:#7C889E}
.stages{border-top:1px solid var(--grid);padding:28px 0 80px;display:grid;grid-template-columns:repeat(3,1fr);gap:32px}
.stages h2{font-size:19px;margin:0 0 6px}
.stages p{margin:0;font-size:16px;line-height:1.7;color:var(--ink-soft)}
@media (max-width:860px){.hero{grid-template-columns:1fr;padding-top:28px}.subjects{grid-template-columns:1fr 1fr}.stages{grid-template-columns:1fr;gap:20px}}
@media (max-width:520px){.subjects{grid-template-columns:1fr}}
</style>
</head>
<body>
<header><div class="wrap"><a class="logo" href="./"><span>test-arena</span></a><nav><a href="browse.html?subj=math">수학</a><a href="browse.html?subj=sci">과학</a></nav></div></header>
<main class="wrap">
  <section class="hero">
    <div>
      <h1>답이 아니라<br>증명을 씁니다</h1>
      <p class="lede">올림피아드는 답 하나보다 그 답에 이르는 논증을 봅니다. 짧은 설명과 문제로 도구를 익히고, 증명을 직접 쓴 뒤 모범 증명과 채점 기준으로 스스로 채점합니다.</p>
      <div class="cta"><a class="btn" href="player.html?subj=math&s=1&t=proof&ch=01&l=01">수학 첫 레슨 시작하기</a><a class="btn ghost" href="browse.html?subj=math">수학 트랙 보기</a></div>
    </div>
    <figure class="sheet" aria-label="자가 채점 화면 예시">
      <p class="q">홀수 n에 대해 n² − 1이 8의 배수임을 증명하세요.</p>
      <ol><li>n = 2k + 1로 놓는다.</li><li>n² − 1 = 4k(k + 1)</li><li>k(k + 1)은 연속한 두 정수의 곱이라 짝수</li></ol>
      <ul>
        <li class="c on"><i></i><span>n = 2k + 1로 나타냈다</span><b>1점</b></li>
        <li class="c on"><i></i><span>4k(k + 1)로 정리했다</span><b>2점</b></li>
        <li class="c"><i></i><span>k(k + 1)이 짝수인 이유를 밝혔다</span><b>2점</b></li>
      </ul>
      <figcaption>모범 증명과 비교해 내 답안에 있는 기준만 체크합니다.</figcaption>
    </figure>
  </section>
  <section class="subjects" id="subjects" aria-label="분야"></section>
  <section class="stages" aria-label="단계">
    <div><h2>S1 예선</h2><p>국내 1차 시험 수준. 교과를 넘어서는 경시 도구와 증명 쓰기를 레슨으로 배웁니다.</p></div>
    <div><h2>S2 본선</h2><p>국내 2차·최종 선발 수준. 서술형 증명이 중심이고, 채점 기준으로 스스로 채점합니다.</p></div>
    <div><h2>S3 국제</h2><p>국제 대회 수준. 목차와 학습 가이드를 따라 독학합니다.</p></div>
  </section>
</main>
<script>
(async () => {
  const box = document.getElementById("subjects");
  const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c]));
  try{
    const r = await fetch("content/catalog.json"); const d = await r.json();
    box.innerHTML = d.subjects.map(s => s.available
      ? `<a href="browse.html?subj=${s.id}"><h2>${esc(s.title)}</h2><p class="path">${esc(s.path)}</p><p>${esc(s.description)}</p></a>`
      : `<div><h2>${esc(s.title)}</h2><p class="path">${esc(s.path)}</p><p>${esc(s.description)}</p><em>준비 중</em></div>`).join("");
  }catch(e){ box.remove(); }
})();
</script>
</body>
</html>
