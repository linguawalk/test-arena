<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>트랙 · test-arena</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--paper:#FAFBFD;--ink:#172033;--ink-soft:#4A5670;--grid:#DCE4F0;--grid-strong:#B9C7DD;--blue:#7A1F3D;--blue-soft:#F6E8EE;--marker:#FFD84D;--marker-soft:#FFF4C2;--ok:#1E7A50;
  --font:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif}
*{box-sizing:border-box}
html,body{margin:0;word-break:keep-all;overflow-wrap:anywhere;background:var(--paper);color:var(--ink);font-family:var(--font)}
body{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
a{color:inherit}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.wrap{max-width:1040px;margin:0 auto;padding:0 20px}
header{border-bottom:1px solid var(--grid)}
header .wrap{display:flex;align-items:center;justify-content:space-between;height:60px}
.logo{font-weight:700;font-size:18px;text-decoration:none;letter-spacing:-.01em;white-space:nowrap;margin-right:12px}
.logo span{background:linear-gradient(transparent 58%,var(--marker) 58%)}
.subj{font-size:15px;color:var(--ink-soft);text-align:right}
.stages{display:flex;gap:6px;padding:20px 0 0;flex-wrap:wrap}
.stages a,.stages span{padding:8px 14px;border-radius:999px;font-size:15px;text-decoration:none;border:1px solid var(--grid-strong)}
.stages a[aria-current]{background:var(--blue);border-color:var(--blue);color:#fff;font-weight:700}
.stages a:hover:not([aria-current]){background:var(--blue-soft)}
.stages span{color:#7C889E;border-style:dashed}
.layout{display:grid;grid-template-columns:240px 1fr;gap:40px;padding-top:28px;padding-bottom:80px}
.layout>*{min-width:0}
nav h2{font-size:14px;font-weight:500;color:var(--ink-soft);margin:0 0 12px}
nav ol{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
nav a{display:flex;gap:10px;padding:9px 10px;border-radius:8px;text-decoration:none;font-size:16px}
nav a[aria-current]{background:var(--blue-soft);color:var(--blue);font-weight:700}
nav a:hover{background:var(--blue-soft)}
nav .no{color:var(--ink-soft);width:1.2em;font-variant-numeric:tabular-nums}
nav .grp{font-size:13px;font-weight:700;color:var(--blue);padding:10px 10px 4px;letter-spacing:.02em}
nav em{font-style:normal;font-size:13px;margin-left:auto;color:#7C889E}
.head h1{font-size:34px;margin:0 0 8px;letter-spacing:-.02em}
.head p{margin:0;color:var(--ink-soft);font-size:17px;line-height:1.6}
.meter{margin:22px 0 34px;display:flex;align-items:center;gap:14px;font-size:15px;color:var(--ink-soft)}
.meter .track{flex:1;max-width:320px;height:8px;background:var(--grid);border-radius:4px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--ok);width:0}
.chapter{border-top:2px solid var(--ink);padding:18px 0 26px}
.chapter h2{margin:0 0 14px;font-size:21px;display:flex;gap:12px;align-items:baseline}
.chapter h2 .no{font-size:15px;color:var(--ink-soft);font-weight:500;font-variant-numeric:tabular-nums}
.chapter.soon{border-top-color:var(--grid-strong);padding-bottom:8px}
.chapter.soon h2{color:var(--ink-soft);font-size:18px}
.chapter.soon h2 em{margin-left:auto;font-style:normal;font-size:13px;font-weight:500;color:#7C889E}
.items{list-style:none;margin:0;padding:0}
.items a{display:grid;grid-template-columns:28px 1fr auto;align-items:center;gap:12px;padding:12px 8px;border-bottom:1px solid var(--grid);text-decoration:none;font-size:17px}
.items a:hover{background:var(--blue-soft)}
.items .state{width:18px;height:18px;border:2px solid var(--grid-strong);border-radius:50%}
.items .done .state{background:var(--ok);border-color:var(--ok);position:relative}
.items .done .state::after{content:"";position:absolute;left:4px;top:1px;width:5px;height:9px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg)}
.items .meta{font-size:14px;color:var(--ink-soft);font-variant-numeric:tabular-nums;white-space:nowrap}
.items .review .t{font-weight:500}
.items .review .state{border-radius:4px}
.empty{padding:24px;border:2px dashed var(--grid-strong);border-radius:10px;color:var(--ink-soft);line-height:1.6}
.note{margin:0 0 22px;padding:12px 14px;border-radius:8px;background:var(--blue-soft);font-size:15px;line-height:1.6}
@media (max-width:760px){.subj .path{display:none}.layout{grid-template-columns:1fr;gap:24px}nav ol{flex-direction:row;overflow-x:auto;padding-bottom:6px}nav a{white-space:nowrap}nav .grp{padding:9px 4px 9px 0;white-space:nowrap}.head h1{font-size:28px}}
</style>
</head>
<body>
<header><div class="wrap"><a class="logo" href="./"><span>test-arena</span></a><span class="subj" id="subj"></span></div></header>
<div class="wrap"><div class="stages" id="stages" aria-label="단계"></div></div>
<div class="wrap layout">
  <nav aria-label="트랙"><h2>트랙</h2><ol id="tracks"></ol></nav>
  <main id="main"></main>
</div>
<script>
"use strict";
const P = new URLSearchParams(location.search);
const SUBJ = P.get("subj") || "math", SG = P.get("s") || "1";
const progress = (() => { try { return JSON.parse(localStorage.getItem("test-arena:progress")) || {}; } catch (e) { return {}; } })();
const pad = n => String(n).padStart(2, "0");
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c]));
async function j(u){ const r = await fetch(u); if (!r.ok) throw new Error(u); return r.json(); }

(async () => {
  const main = document.getElementById("main");
  try{
    const subj = await j(`content/${SUBJ}/subject.json`);
    document.getElementById("subj").innerHTML = `${esc(subj.subject.title)}<span class="path"> · ${esc(subj.subject.path)}</span>`;
    const stage = subj.stages.find(s => String(s.no) === SG) || subj.stages[0];
    document.getElementById("stages").innerHTML = subj.stages.map(s => s.available
      ? `<a href="?subj=${SUBJ}&s=${s.no}"${s === stage ? ' aria-current="page"' : ""}>${esc(s.title)}</a>`
      : `<span>${esc(s.title)} · 준비 중</span>`).join("");
    const TRACK = P.get("t") || (stage.tracks.find(t => t.available) || stage.tracks[0]).id;
    let grp = null;
    document.getElementById("tracks").innerHTML = stage.tracks.map((t, k) => {
      const head = t.group && t.group !== grp ? `<li class="grp">${esc(t.group)}</li>` : ""; grp = t.group || grp;
      return head + `<li><a href="?subj=${SUBJ}&s=${stage.no}&t=${t.id}"${t.id === TRACK ? ' aria-current="page"' : ""}><span class="no">${k + 1}</span>${esc(t.title)}${t.available ? "" : "<em>준비 중</em>"}</a></li>`; }).join("");
    const cur = document.querySelector('#tracks a[aria-current]');
    if (cur && matchMedia("(max-width:760px)").matches){ const ol = document.getElementById("tracks"); ol.scrollLeft = cur.offsetLeft - 16; }
    const tr = await j(`content/${SUBJ}/s${stage.no}/${TRACK}/track.json`);
    const Q = `subj=${SUBJ}&s=${stage.no}&t=${TRACK}`;
    const open = tr.chapters.filter(c => c.available);
    const metas = await Promise.all(open.map(c => j(`content/${SUBJ}/s${stage.no}/${TRACK}/${c.dir}/chapter.json`)));
    const byNo = Object.fromEntries(metas.map(m => [m.chapter.no, m]));
    let total = 0, done = 0;
    const html = tr.chapters.map(c => {
      if (!c.available) return `<section class="chapter soon"><h2><span class="no">${c.no}</span>${esc(c.title)}<em>준비 중</em></h2></section>`;
      const ch = byNo[c.no], n = pad(c.no);
      const rows = ch.lessons.map(l => { total++; const p = progress[l.id]; if (p) done++;
        return `<li><a class="${p ? "done" : ""}" href="player.html?${Q}&ch=${n}&l=${pad(l.no)}">
          <span class="state" aria-hidden="true"></span><span class="t">${esc(l.title)}</span>
          <span class="meta">${p ? `${p.first}/${p.total}` : `${l.questions}문항`}</span></a></li>`; });
      if (ch.review){ total++; const p = progress[ch.review.id]; if (p) done++;
        rows.push(`<li><a class="review ${p ? "done" : ""}" href="player.html?${Q}&ch=${n}&review=1">
          <span class="state" aria-hidden="true"></span><span class="t">챕터 복습</span>
          <span class="meta">${p ? `${p.first}/${p.total}` : `${ch.review.questions}문항`}</span></a></li>`); }
      return `<section class="chapter" id="ch${n}"><h2><span class="no">${c.no}</span>${esc(c.title)}</h2><ol class="items">${rows.join("")}</ol></section>`;
    }).join("");
    const pct = total ? Math.round(done / total * 100) : 0;
    const count = tr.totals.lessons ? `레슨 ${tr.totals.lessons}개, ${tr.totals.questions}문항이 열려 있습니다.` : "아직 열린 레슨이 없습니다.";
    const note = SUBJ === "math" && TRACK !== "proof" && stage.no === 1 ? `<div class="note">처음이라면 <a href="?subj=${SUBJ}&s=1&t=proof">증명의 기초</a> 트랙부터 시작하세요. 다른 트랙의 증명 문항이 이 트랙의 방법을 씁니다.</div>` : "";
    main.innerHTML = note + `<div class="head"><h1>${esc(tr.track.title)}</h1><p>${esc(stage.title)} · ${esc(stage.level)}. ${esc(tr.track.description)}. ${count}</p></div>
      ${total ? `<div class="meter"><div class="track" role="progressbar" aria-label="트랙 진행률" aria-valuenow="${pct}" aria-valuemin="0" aria-valuemax="100"><i style="width:${pct}%"></i></div><span>${done} / ${total} 완료</span></div>` : ""}${html}`;
    document.title = `${tr.track.title} · test-arena`;
  }catch(e){
    main.innerHTML = `<div class="empty">정보를 불러오지 못했습니다. <code>${esc(e.message)}</code> 파일이 저장소에 있는지 확인하세요.</div>`;
  }
})();
</script>
</body>
</html>
